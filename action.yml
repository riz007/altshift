name: Ariamend
description: Fixes accessibility findings in storefront source code and opens one pull request with gated fixes and an evidence pack.
author: Rudra
branding:
  icon: check-circle
  color: blue

# The Action runs the copy of ariamend your project installed (pnpm add -D ariamend), so the version
# is the one your lockfile pins and nothing is downloaded while the job holds your secrets.

inputs:
  mode:
    description: "debt (scheduled or manual run). pr is not available yet"
    default: debt
  config:
    description: Config path, relative to the repository root
    default: ariamend.config.ts
  working-directory:
    description: Folder whose node_modules has ariamend installed, relative to the repository root
    default: "."
  anthropic-api-key:
    description: Anthropic API key (bring your own key)
    required: true
  license-key:
    description: Reserved for a later hosted plan
    required: false
  github-token:
    description: GitHub API access
    default: ${{ github.token }}
  max-fixes:
    description: Override fix.maxFixesPerRun
    required: false
  budget-usd:
    description: Override fix.budgetUsd
    required: false

outputs:
  fixes-accepted:
    description: Fixes that passed every gate
    value: ${{ steps.run.outputs.fixes-accepted }}
  fixes-rejected:
    description: Fixes dropped because a gate failed
    value: ${{ steps.run.outputs.fixes-rejected }}
  fixes-suggested:
    description: Proposals listed in the evidence pack and not applied
    value: ${{ steps.run.outputs.fixes-suggested }}
  cost-usd:
    description: Model cost of the run
    value: ${{ steps.run.outputs.cost-usd }}
  pr-url:
    description: The pull request that was opened or updated
    value: ${{ steps.run.outputs.pr-url }}
  evidence-path:
    description: Path of the evidence pack
    value: ${{ steps.run.outputs.evidence-path }}

runs:
  using: composite
  steps:
    - name: Find ariamend
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ ! -x node_modules/.bin/ariamend ]; then
          echo "::error::ariamend is not installed in '${PWD}'. Add it as a devDependency and install your dependencies before this step."
          exit 1
        fi

    - name: Install Chromium
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node_modules/.bin/ariamend install-browser --with-deps

    - name: Run Ariamend
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node_modules/.bin/ariamend action
      # Composite actions do not set INPUT_* on their own. The names use underscores, not hyphens:
      # on Ubuntu, /bin/sh (dash) drops variables with hyphenated names, and package managers often
      # start the ariamend command through a /bin/sh launcher.
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        INPUT_LICENSE_KEY: ${{ inputs.license-key }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_MAX_FIXES: ${{ inputs.max-fixes }}
        INPUT_BUDGET_USD: ${{ inputs.budget-usd }}
