# Example workflow for a storefront repo. The Action is not published yet:
# replace OWNER when it is. Every action is pinned to a commit SHA; update them on purpose.
#
# It runs on a schedule on the default branch, so secrets are never exposed to code from a fork.
# It needs "Allow GitHub Actions to create and approve pull requests" turned on in the repository settings.

name: Accessibility debt
on:
  schedule:
    - cron: "17 2 * * 1" # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Ariamend commits through the GitHub API. Keeping the token off disk means the project's own
      # scripts, which Ariamend runs as part of its checks, cannot pick it up from .git/config.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: lts/*
          cache: pnpm
      # ariamend must be a devDependency: the Action runs the version your lockfile pins.
      - run: pnpm install --frozen-lockfile

      - id: ariamend
        uses: OWNER/ariamend@v0
        with:
          mode: debt
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          budget-usd: "5"

      # Screenshots can show test-site data. Keep the retention short.
      - name: Upload the evidence pack
        if: always() && steps.ariamend.outputs.evidence-path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ariamend-evidence
          path: ${{ steps.ariamend.outputs.evidence-path }}
          retention-days: 14
          # The pack lives in .ariamend/, and hidden folders are skipped unless asked for.
          include-hidden-files: true
