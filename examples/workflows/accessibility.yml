# Example workflow for a storefront repo. The Action is not published yet:
# replace OWNER when it is, and pin every action to a commit SHA.
#
# It runs on a schedule on the default branch, so secrets are never exposed to code from a fork.

name: Accessibility debt
on:
  schedule:
    - cron: "17 2 * * 1" # weekly, Monday
  workflow_dispatch:

jobs:
  debt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: OWNER/altshift@v0
        with:
          mode: debt
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
